                devExpenses: Array.isArray(raw.devExpenses) ? raw.devExpenses : def.devExpenses

        async function loadClinicData() {
            const localRaw = localStorage.getItem(`fisio_v5_${storeId}`);
            if (localRaw) {
                try { dbData = ensureDataIntegrity(JSON.parse(localRaw), storeId); } catch(e) {}
            }
            applyThemeAndColors();
            renderApp();

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/fisio_data?store_id=eq.${storeId}`, {
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                if (res.ok) {
                    const rows = await res.json();
                    if (rows && rows.length > 0 && rows[0].data) {
                        dbData = ensureDataIntegrity(rows[0].data, storeId);
                        localStorage.setItem(`fisio_v5_${storeId}`, JSON.stringify(dbData));
                    } else {
                        await saveClinicData();
                    }
                    document.getElementById('sync-dot').className = "w-2 h-2 rounded-full bg-emerald-500";
                }
            } catch (err) {
                document.getElementById('sync-dot').className = "w-2 h-2 rounded-full bg-amber-500";
            }
            applyThemeAndColors();
            renderApp();
        }

        async function saveClinicData(customSlug = storeId, customData = dbData) {
            localStorage.setItem(`fisio_v5_${customSlug}`, JSON.stringify(customData));
            if (customSlug === storeId) applyThemeAndColors();
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/fisio_data`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'resolution=merge-duplicates'
                    },
                    body: JSON.stringify({
                        store_id: customSlug,
                        data: customData,
                        updated_at: new Date().toISOString()
                    })
                });

            } catch (err) {

        }

        function formatBRL(val) {
            return Number(val || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        function formatDateBR(isoDate) {
            if (!isoDate) return '-';
            const parts = isoDate.split('-');
            if (parts.length !== 3) return isoDate;
            return `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
        function getWeekRange(dateStr) {
            const d = new Date(dateStr + "T12:00:00");
            const day = d.getDay();
            const diffToMonday = d.getDate() - day + (day === 0 ? -6 : 1);
            const start = new Date(d.setDate(diffToMonday));
            const end = new Date(start);
            end.setDate(start.getDate() + 6);
            return {
                start: start.toISOString().split('T')[0],
                end: end.toISOString().split('T')[0]
            };
        }

            const found = dbData.patients.find(p => {
                const pPhone = (p.phone || '').replace(/\D/g, '');
                const pCpf = (p.cpf || '').replace(/\D/g, '');
                return (pPhone === rawInput || (pCpf && pCpf === rawInput)) && String(p.password) === passInput;
            });

            if (!found) {
                alert("Login ou senha inválidos. Verifique os dados enviados pelo seu fisioterapeuta.");

            currentSession = { role: 'patient', user: found };
            window.scrollTo({ top: 0, behavior: 'smooth' });

                                            <strong class="text-sm text-emerald-600 dark:text-emerald-400">${formatBRL(paidTotal)}</strong>
                                        </div>
                                        <div class="p-3 rounded-xl bg-amber-500/10 border border-amber-500/20">
                                            <span class="text-slate-500 dark:text-slate-400 block text-[11px]">A Receber</span>

                                        </div>
                                    </div>

        // =========================================================================
        // 7. PAINEL DO PROPRIETÁRIO / FISIOTERAPEUTA (OBEDECE AO BLOQUEIO DO MASTER)
        // =========================================================================
        function renderOwnerDashboardScreen() {
            const cfg = dbData.config;

            // Se a aba atual foi bloqueada pelo Desenvolvedor Master, redireciona para a primeira liberada
            if (navItems.length > 0 && !navItems.some(i => i.id === ownerTab)) {
                ownerTab = navItems[0].id;
            }

            return `
                <div class="flex-1 flex flex-col lg:flex-row bg-slate-100 dark:bg-slate-950">
                    <aside class="w-full lg:w-64 bg-white dark:bg-slate-900 border-b lg:border-b-0 lg:border-r border-slate-200 dark:border-slate-800 flex flex-col shrink-0 sticky top-0 z-30 lg:static">
                        <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between gap-3">
                            <div class="flex items-center gap-3 min-w-0">

                                <div class="min-w-0">
                                    <span class="text-[10px] font-extrabold uppercase tracking-wider text-brand block">Admin Clínica</span>

                            ${navItems.map(item => `
                                <button onclick="ownerTab='${item.id}'; renderApp();" class="flex items-center gap-2.5 px-3.5 py-2.5 rounded-xl whitespace-nowrap transition ${ownerTab === item.id ? 'bg-brand-gradient text-white shadow-md' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                                    <i class="fa-solid ${item.icon} w-4 text-center"></i>
                                    <span>${item.label}</span>
                                </button>
                            `).join('')}
                        </nav>

                        <div class="hidden lg:block mt-auto p-4 border-t border-slate-200 dark:border-slate-800 space-y-2">
                            ${currentSession.impersonatedByMaster ? `
                            <button onclick="returnToMasterFromImpersonation()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold py-2.5 px-3 rounded-xl transition flex items-center justify-center gap-2 shadow">
                                <i class="fa-solid fa-user-secret"></i> Voltar ao Painel Master
                            </button>` : ''}
                            <button onclick="printGeneralClinicMirror()" class="w-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200 text-xs font-bold py-2.5 px-3 rounded-xl transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-print text-brand"></i> Emitir Espelho Geral
                            </button>
                            <button onclick="logout()" class="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-600 dark:text-rose-400 text-xs font-bold py-2 px-3 rounded-xl transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair do Painel
                            </button>
                        </div>
                    </aside>

                    <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-full overflow-x-hidden">
                        ${currentSession.impersonatedByMaster ? `
                        <div class="mb-4 p-3 rounded-2xl bg-amber-500/15 border border-amber-500/40 flex flex-wrap items-center justify-between gap-2 text-xs">
                            <span class="font-bold text-amber-600 dark:text-amber-400"><i class="fa-solid fa-shield-halved mr-1"></i> Modo Desenvolvedor Ativo: Você está acessando e gerenciando a clínica <b>${cfg.name} (?clinica=${storeId})</b>.</span>
                            <button onclick="returnToMasterFromImpersonation()" class="px-3 py-1 rounded-lg bg-amber-500 text-slate-950 font-extrabold">Voltar para Todas as Clínicas</button>
                        </div>` : ''}
                        ${navItems.length === 0 ? `<div class="p-8 text-center bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 text-sm font-bold text-rose-500">Nenhuma tela foi habilitada pelo Desenvolvedor para este acesso.</div>` : renderOwnerTabBody()}
                    </main>
                </div>
            `;
        }

        function renderOwnerTabBody() {
            const allowed = dbData.config.masterAllowedScreens || {};
            if (allowed[ownerTab] === false) return '';
            if (ownerTab === 'agenda') return renderOwnerAgendaView();
            if (ownerTab === 'patients') return renderOwnerPatientsView();
            if (ownerTab === 'evolutions') return renderOwnerEvolutionsView();
            if (ownerTab === 'finance') return renderOwnerFinanceView();
            if (ownerTab === 'staff') return renderOwnerStaffView();
            if (ownerTab === 'settings') return renderOwnerSettingsView();
            return '';
        }

        // =========================================================================
        // 7.1 A 7.6 TELAS DO PROPRIETÁRIO
        // =========================================================================
        function filterAppointmentsByMode() {
            if (agendaViewMode === 'day') return dbData.appointments.filter(a => a.date === agendaBaseDate);
            if (agendaViewMode === 'week') {
                const r = getWeekRange(agendaBaseDate);
                return dbData.appointments.filter(a => a.date >= r.start && a.date <= r.end);
            }
            if (agendaViewMode === 'month') {
                const ym = agendaBaseDate.slice(0, 7);
                return dbData.appointments.filter(a => a.date.startsWith(ym));
            }
            return dbData.appointments;
        }

        function changeAgendaDateOffset(dir) {
            const d = new Date(agendaBaseDate + "T12:00:00");
            if (agendaViewMode === 'day') d.setDate(d.getDate() + dir);
            if (agendaViewMode === 'week') d.setDate(d.getDate() + (dir * 7));
            if (agendaViewMode === 'month') d.setMonth(d.getMonth() + dir);
            agendaBaseDate = d.toISOString().split('T')[0];
            renderApp();
        }

        function renderOwnerAgendaView() {
            const filtered = filterAppointmentsByMode().sort((a,b) => (a.date + a.time).localeCompare(b.date + b.time));
            const totalCount = filtered.length;
            const doneCount = filtered.filter(a => a.status === 'Realizado').length;
            const pendingCount = filtered.filter(a => a.status === 'Agendado' || a.status === 'Confirmado').length;
            const canceledCount = filtered.filter(a => a.status === 'Faltou/Cancelado').length;
            const revenueEstimated = filtered.filter(a => a.status !== 'Faltou/Cancelado').reduce((acc, a) => acc + Number(a.value || 0), 0);

            let periodLabel = formatDateBR(agendaBaseDate);
            if (agendaViewMode === 'week') {
                const r = getWeekRange(agendaBaseDate);
                periodLabel = `${formatDateBR(r.start)} a ${formatDateBR(r.end)}`;
            } else if (agendaViewMode === 'month') {
                const [y, m] = agendaBaseDate.split('-');
                periodLabel = `Mês ${m}/${y}`;
            }

            return `
                <div class="space-y-5">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 sm:p-5 rounded-2xl shadow-sm">
                        <div>
                            <h1 class="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white">Agenda & Indicadores Dinâmicos</h1>
                            <p class="text-xs text-slate-500">Alterne entre Dia, Semana e Mês para atualizar os resultados</p>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <div class="inline-flex rounded-xl bg-slate-100 dark:bg-slate-800 p-1 text-xs font-bold">
                                <button onclick="agendaViewMode='day'; renderApp();" class="px-3 py-1.5 rounded-lg transition ${agendaViewMode === 'day' ? 'bg-brand text-white' : 'text-slate-600 dark:text-slate-300'}">Dia</button>
                                <button onclick="agendaViewMode='week'; renderApp();" class="px-3 py-1.5 rounded-lg transition ${agendaViewMode === 'week' ? 'bg-brand text-white' : 'text-slate-600 dark:text-slate-300'}">Semana</button>
                                <button onclick="agendaViewMode='month'; renderApp();" class="px-3 py-1.5 rounded-lg transition ${agendaViewMode === 'month' ? 'bg-brand text-white' : 'text-slate-600 dark:text-slate-300'}">Mês</button>
                            </div>
                            <button onclick="openAppointmentFormModal()" class="bg-brand-gradient text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow flex items-center gap-1.5">
                                <i class="fa-solid fa-plus"></i> Agendar
                            </button>
                        </div>
                    </div>

                    <div class="flex flex-wrap items-center justify-between gap-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 px-4 py-3 rounded-2xl">
                        <div class="flex items-center gap-2">
                            <button onclick="changeAgendaDateOffset(-1)" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-xs"><i class="fa-solid fa-chevron-left"></i></button>
                            <span class="text-xs sm:text-sm font-extrabold text-slate-900 dark:text-white">${periodLabel}</span>
                            <button onclick="changeAgendaDateOffset(1)" class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-xs"><i class="fa-solid fa-chevron-right"></i></button>
                        </div>
                        <div class="flex items-center gap-2">
                            <input type="date" value="${agendaBaseDate}" onchange="agendaBaseDate=this.value; renderApp();" class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-2.5 py-1.5 text-xs">
                            <button onclick="agendaBaseDate=new Date().toISOString().split('T')[0]; renderApp();" class="text-xs font-bold text-brand px-2.5 py-1.5 rounded-lg bg-brand-soft">Hoje</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 sm:gap-4">
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Total Período</span>
                            <h3 class="text-2xl font-extrabold text-slate-900 dark:text-white mt-0.5">${totalCount}</h3>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">
                            <span class="text-[10px] font-bold text-emerald-500 uppercase">Realizados</span>
                            <h3 class="text-2xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-0.5">${doneCount}</h3>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">
                            <span class="text-[10px] font-bold text-sky-500 uppercase">Confirmados</span>
                            <h3 class="text-2xl font-extrabold text-sky-600 dark:text-sky-400 mt-0.5">${pendingCount}</h3>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">
                            <span class="text-[10px] font-bold text-rose-500 uppercase">Faltas</span>
                            <h3 class="text-2xl font-extrabold text-rose-500 mt-0.5">${canceledCount}</h3>
                        </div>
                        <div class="col-span-2 lg:col-span-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4">
                            <span class="text-[10px] font-bold text-brand uppercase">Produção</span>
                            <h3 class="text-xl font-extrabold text-brand mt-0.5">${formatBRL(revenueEstimated)}</h3>
                        </div>
                    </div>

                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm">
                        <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                            <h3 class="text-xs sm:text-sm font-extrabold text-slate-900 dark:text-white">Atendimentos (${filtered.length})</h3>
                            <button onclick="printGeneralClinicMirror()" class="text-xs font-bold text-brand hover:underline flex items-center gap-1">
                                <i class="fa-solid fa-print"></i> Espelho do Período
                            </button>
                        </div>
                        <div class="divide-y divide-slate-200 dark:divide-slate-800">
                            ${filtered.length === 0 ? `<p class="p-8 text-center text-xs text-slate-400">Nenhum atendimento neste período.</p>` : ''}
                            ${filtered.map(a => `
                                <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50 dark:hover:bg-slate-800/40">
                                    <div class="space-y-0.5">
                                        <div class="flex items-center gap-2">
                                            <span class="text-xs font-extrabold text-brand">${formatDateBR(a.date)} às ${a.time}</span>
                                            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                                a.status === 'Realizado' ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400' :
                                                a.status === 'Confirmado' ? 'bg-sky-500/15 text-sky-600 dark:text-sky-400' :
                                                a.status === 'Faltou/Cancelado' ? 'bg-rose-500/15 text-rose-500' :
                                                'bg-amber-500/15 text-amber-600'

                                        <p class="text-xs text-slate-500">${a.serviceName} • ${formatBRL(a.value)}</p>
                                    </div>
                                    <div class="flex flex-wrap items-center gap-1.5">
                                        ${a.status !== 'Realizado' ? `
                                        <button onclick="markAppointmentDoneAndEvolve(${a.id})" class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center gap-1">
                                            <i class="fa-solid fa-check"></i> Realizar + Evoluir
                                        </button>` : ''}
                                        <button onclick="openAppointmentFormModal(${a.id})" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-semibold">
                                            Reagendar
                                        </button>
                                        <button onclick="deleteAppointment(${a.id})" class="p-2 rounded-xl text-rose-500 hover:bg-rose-500/10">
                                            <i class="fa-solid fa-trash text-xs"></i>
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderOwnerPatientsView() {
            return `
                <div class="space-y-5">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl">
                        <div>
                            <h1 class="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white">Pacientes Cadastrados & Senhas</h1>

                        </div>
                        <button onclick="openPatientFormModal()" class="bg-brand-gradient text-white text-xs font-bold px-4 py-3 rounded-xl shadow flex items-center justify-center gap-2">
                            <i class="fa-solid fa-user-plus"></i> Novo Paciente
                        </button>
                    </div>

                    <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
                        ${dbData.patients.map(p => {
                            const patRecs = dbData.records.filter(r => r.patientId === p.id).length;
                            return `
                                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 flex flex-col justify-between gap-4 shadow-sm">
                                    <div>
                                        <div class="flex items-start justify-between gap-2">
                                            <div>
                                                <span class="text-[10px] font-bold uppercase text-brand">${p.area || 'Fisioterapia'}</span>

                                            </div>
                                            <span class="px-2.5 py-1 rounded-xl text-xs font-bold bg-brand-soft text-brand shrink-0">
                                                ${p.packageUsed}/${p.packageTotal} sessões
                                            </span>
                                        </div>
                                        <div class="mt-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 text-xs space-y-1">

                                            <p><strong>Senha do Paciente:</strong> <code class="px-2 py-0.5 rounded bg-amber-500/20 text-brand font-bold">${p.password}</code> • <strong>Evoluções:</strong> ${patRecs}</p>
                                        </div>
                                    </div>
                                    <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
                                        <div class="flex flex-wrap gap-1.5">
                                            <button onclick="sendPatientCredentialsWhatsApp(${p.id})" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5">
                                                <i class="fa-brands fa-whatsapp"></i> Enviar Acesso
                                            </button>
                                            <button onclick="openEvolutionFormModal(${p.id})" class="bg-brand text-white text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5">
                                                <i class="fa-solid fa-plus"></i> Evoluir
                                            </button>
                                            <button onclick="printPatientMirror(${p.id})" class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 text-xs font-bold px-3 py-2 rounded-xl flex items-center gap-1.5">
                                                <i class="fa-solid fa-print text-brand"></i> Espelho
                                            </button>
                                        </div>
                                        <div class="flex items-center gap-1">
                                            <button onclick="openPatientFormModal(${p.id})" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800"><i class="fa-solid fa-pen"></i></button>
                                            <button onclick="deletePatient(${p.id})" class="p-2 rounded-lg text-rose-500 hover:bg-rose-500/10"><i class="fa-solid fa-trash"></i></button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function renderOwnerEvolutionsView() {
            const patFilter = selectedPatientIdForDetail ? Number(selectedPatientIdForDetail) : null;
            const list = patFilter ? dbData.records.filter(r => r.patientId === patFilter) : dbData.records;
            const sorted = [...list].sort((a,b) => b.date.localeCompare(a.date));

            return `
                <div class="space-y-5">

        function handleLogoFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const maxDim = 380;
                    let w = img.width, h = img.height;
                    if (w > maxDim || h > maxDim) {
                        if (w > h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
                        else { w = Math.round(w * (maxDim / h)); h = maxDim; }
                    }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    const dataUrl = canvas.toDataURL('image/png', 0.9);
                    dbData.config.logoUrl = dataUrl;
                    document.getElementById('settings-logo-preview').src = dataUrl;
                    document.getElementById('cfg-logo-url').value = dataUrl;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

            dbData.config.address = document.getElementById('cfg-address').value.trim();
            dbData.config.workingHours = document.getElementById('cfg-hours').value.trim();
            dbData.config.themeColor = document.getElementById('cfg-theme').value;
            dbData.config.darkMode = document.getElementById('cfg-darkmode').value === 'true';

            const staffCheckbox = document.getElementById('cfg-staff-module');
            if (staffCheckbox && dbData.config.masterAllowedScreens?.staff !== false) {
                dbData.config.enableStaffModule = staffCheckbox.checked;

            const pSoap = document.getElementById('perm-soap');

            const pFin  = document.getElementById('perm-fin');
            const pHome = document.getElementById('perm-home');
            const pPrt  = document.getElementById('perm-print');

            if (pSoap) dbData.config.patientPermissions.showSoapRecords = pSoap.checked;
            if (pEva)  dbData.config.patientPermissions.showPainScale = pEva.checked;
            if (pFin)  dbData.config.patientPermissions.showFinancial = pFin.checked;
            if (pHome) dbData.config.patientPermissions.showHomework = pHome.checked;

        async function saveMasterClinicForm(e, editSlug) {
            e.preventDefault();
            const rawSlug = editSlug || document.getElementById('mc-slug').value.toLowerCase().trim().replace(/[^a-z0-9_-]/g, '');
            if (!rawSlug || rawSlug === MASTER_CONFIG_ID) {
                alert("Informe um identificador (slug) válido para a clínica.");
                return;
            }

            const existingItem = allClinicsList.find(c => c.store_id === rawSlug);
            const clinicObj = existingItem ? ensureDataIntegrity(existingItem.data, rawSlug) : getDefaultData(rawSlug);

            clinicObj.config.name = document.getElementById('mc-name').value.trim();
            clinicObj.config.ownerName = document.getElementById('mc-owner').value.trim();
            clinicObj.config.cnpj = document.getElementById('mc-cnpj').value.trim();
            clinicObj.config.crefito = document.getElementById('mc-crefito').value.trim();
            clinicObj.config.phone = document.getElementById('mc-phone').value.trim();
            clinicObj.config.address = document.getElementById('mc-address').value.trim();
            clinicObj.config.email = document.getElementById('mc-email').value.trim();
            clinicObj.config.password = document.getElementById('mc-pass').value.trim();

            clinicObj.config.saasSubscription = {
                planName: document.getElementById('mc-plan').value.trim(),
                planValue: Number(document.getElementById('mc-val').value || 0),
                billingCycle: 'Mensal',
                paymentMethod: document.getElementById('mc-method').value,
                dueDate: document.getElementById('mc-due').value,
                status: document.getElementById('mc-status').value
            };

            const staffAllowed = document.getElementById('ms-staff').checked;
            clinicObj.config.masterAllowedScreens = {
                agenda: document.getElementById('ms-agenda').checked,
                patients: document.getElementById('ms-patients').checked,
                evolutions: document.getElementById('ms-evolutions').checked,
                finance: document.getElementById('ms-finance').checked,
                staff: staffAllowed,
                settings: document.getElementById('ms-settings').checked
            };
            if (!staffAllowed) {
                clinicObj.config.enableStaffModule = false;
            }

            await saveClinicData(rawSlug, clinicObj);
            if (rawSlug === storeId) {
                dbData = clinicObj;
            }
            closeModal();
            await loadAllClinicsForMaster();
        }

        async function toggleClinicScreenPermission(slug, screenKey) {
            const item = allClinicsList.find(c => c.store_id === slug);
            if (!item) return;
            if (!item.data.config.masterAllowedScreens) {
                item.data.config.masterAllowedScreens = { agenda: true, patients: true, evolutions: true, finance: true, staff: true, settings: true };
            }
            const currentVal = item.data.config.masterAllowedScreens[screenKey] !== false;
            item.data.config.masterAllowedScreens[screenKey] = !currentVal;
            if (screenKey === 'staff' && currentVal === true) {
                item.data.config.enableStaffModule = false;
            }
            await saveClinicData(slug, item.data);
            if (slug === storeId) dbData = item.data;
            renderApp();
        }

        async function toggleClinicLockStatus(slug) {
            const item = allClinicsList.find(c => c.store_id === slug);
            if (!item) return;
            const cur = item.data.config.saasSubscription?.status || 'Ativo';
            item.data.config.saasSubscription.status = cur === 'Bloqueado' ? 'Ativo' : 'Bloqueado';
            await saveClinicData(slug, item.data);
            if (slug === storeId) dbData = item.data;
            renderApp();
        }

        async function deleteClinicFromSupabase(slug) {
            if (!confirm(`Tem certeza que deseja EXCLUIR permanentemente a clínica "?clinica=${slug}" do Supabase?`)) return;
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/fisio_data?store_id=eq.${slug}`, {
                    method: 'DELETE',
                    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
                });
                localStorage.removeItem(`fisio_v5_${slug}`);
            } catch (e) {}
            await loadAllClinicsForMaster();
        }

        // Entrar diretamente no painel de qualquer clínica como Proprietário
        function impersonateClinicOwner(slug) {
            const item = allClinicsList.find(c => c.store_id === slug);
            if (!item) return;
            storeId = slug;
            dbData = ensureDataIntegrity(item.data, slug);
            document.getElementById('footer-store-param').innerText = `?clinica=${storeId}`;
            applyThemeAndColors();
            currentSession = { role: 'owner', user: { name: dbData.config.ownerName || dbData.config.name }, impersonatedByMaster: true };
            ownerTab = 'agenda';
            renderApp();
        }

        function returnToMasterFromImpersonation() {
            currentSession = { role: 'master', user: { name: 'Rafael (Master)' } };
            loadAllClinicsForMaster();
        }

        function sendOwnerAccessWhatsApp(slug) {
            const item = allClinicsList.find(c => c.store_id === slug);
            if (!item) return;
            const cfg = item.data.config;
            const link = `${window.location.origin}${window.location.pathname}?clinica=${slug}`;
            const msg = `Olá *${cfg.ownerName || cfg.name}*! Seu sistema de gestão clínica está pronto e configurado.\n\n🔗 *Link exclusivo da sua clínica:*\n${link}\n\n🔒 *Para acessar o Painel do Proprietário (no rodapé do site):*\n📧 *E-mail:* ${cfg.email}\n🔑 *Senha:* ${cfg.password}\n\nQualquer dúvida estou à disposição!`;
            window.open(`https://wa.me/55${(cfg.phone || '').replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function sendSaasBillingWhatsApp(slug) {
            const item = allClinicsList.find(c => c.store_id === slug);
            if (!item) return;
            const cfg = item.data.config;
            const sub = cfg.saasSubscription || {};
            const msg = `Olá *${cfg.ownerName || cfg.name}*! Tudo bem?\n\nPassando para enviar o lembrete da assinatura do sistema de gestão da *${cfg.name}*:\n\n📋 *Plano:* ${sub.planName || 'Plano Pro'}\n💳 *Forma de Pagamento:* ${sub.paymentMethod || 'PIX Mensal'}\n📅 *Vencimento:* ${formatDateBR(sub.dueDate)}\n💰 *Valor:* ${formatBRL(sub.planValue || 149.90)}\n\n🔑 *Chave PIX para pagamento:* ${masterSaasData.devPixKey}\n\nAssim que realizar, pode me enviar o comprovante por aqui para renovação automática. Obrigado!`;
            window.open(`https://wa.me/55${(cfg.phone || '').replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        async function registerClinicMonthlyPayment(slug) {
            const item = allClinicsList.find(c => c.store_id === slug);
            if (!item) return;
            const cfg = item.data.config;
            const sub = cfg.saasSubscription || {};

            // Avança 1 mês no vencimento
            const baseDate = sub.dueDate ? new Date(sub.dueDate + "T12:00:00") : new Date();
            baseDate.setMonth(baseDate.getMonth() + 1);
            const newDue = baseDate.toISOString().split('T')[0];

            sub.dueDate = newDue;
            sub.status = 'Ativo';
            item.data.config.saasSubscription = sub;

            // Registra no histórico financeiro do Desenvolvedor
            masterSaasData.billingHistory.push({
                id: Date.now(),
                date: new Date().toISOString().split('T')[0],
                storeSlug: slug,
                clinicName: cfg.name,
                ownerName: cfg.ownerName || cfg.name,

                            <input type="text" id="ef-service" value="${defaultService || dbData.config.specialties[0] || 'Fisioterapia'}" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">EVA Dor (0-10)</label>
                            <input type="number" min="0" max="10" id="ef-eva" value="0" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5">
                        </div>
                    </div>
                    <div>
                        <label class="block font-bold mb-1">O que foi feito na sessão? *</label>
                        <textarea id="ef-done" rows="2" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl p-3"></textarea>
                    </div>
                    <div>
                        <label class="block font-bold mb-1">Qual foi a evolução do paciente? *</label>
                        <textarea id="ef-evol" rows="2" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl p-3"></textarea>
                    </div>
                    <div>
                        <label class="block font-bold mb-1">Orientação Domiciliar</label>
                        <textarea id="ef-home" rows="2" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl p-3"></textarea>
                    </div>
                    <div class="pt-2 flex justify-end gap-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 font-semibold">Cancelar</button>
                        <button type="submit" class="px-5 py-2.5 rounded-xl bg-brand text-white font-bold">Salvar Evolução</button>
                    </div>
                </form>
            `);
        }

        function saveEvolutionForm(e) {
            e.preventDefault();
            const patId = Number(document.getElementById('ef-pat').value);
            const pat = dbData.patients.find(p => p.id === patId);
            dbData.records.push({
                id: Date.now(),
                patientId: patId,
                patientName: pat ? pat.name : 'Paciente',
                date: document.getElementById('ef-date').value,
                time: new Date().toTimeString().slice(0,5),
                profName: dbData.config.name,
                serviceName: document.getElementById('ef-service').value.trim(),
                evaScore: Number(document.getElementById('ef-eva').value || 0),
                whatWasDone: document.getElementById('ef-done').value.trim(),
                evolutionNotes: document.getElementById('ef-evol').value.trim(),
                homework: document.getElementById('ef-home').value.trim()
            });
            saveClinicData();
            closeModal();
            renderApp();
        }

        function deleteRecord(id) {
            if (!confirm("Excluir evolução?")) return;
            dbData.records = dbData.records.filter(r => r.id !== id);
            saveClinicData();
            renderApp();
        }

        function openFinanceFormModal(type) {
            const today = new Date().toISOString().split('T')[0];
            showModal(`
                <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3 mb-4">
                    <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${type === 'receita' ? 'Novo Recebimento' : 'Nova Despesa / Equipamento / Curso'}</h3>
                    <button onclick="closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <form onsubmit="saveFinanceForm(event, '${type}')" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                    ${type === 'receita' ? `
                    <div class="sm:col-span-2">
                        <label class="block font-bold mb-1">Paciente</label>
                        <select id="ff-pat" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5">
                            <option value="">Geral / Avulso</option>
                            ${dbData.patients.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}
                        </select>
                    </div>` : ''}
                    <div>
                        <label class="block font-bold mb-1">Categoria</label>
                        <select id="ff-cat" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5">
                            ${type === 'receita'
                                ? `<option value="Pacote de Sessões">Pacote de Sessões</option><option value="Sessão Avulsa">Sessão Avulsa</option>`
                                : `<option value="Equipamentos & Materiais">Equipamentos & Materiais</option><option value="Cursos & Especializações">Cursos & Especializações</option><option value="Custos Fixos">Custos Fixos</option>`
                            }
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold mb-1">Data</label>
                        <input type="date" id="ff-date" value="${today}" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block font-bold mb-1">Descrição *</label>
                        <input type="text" id="ff-desc" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5">
                    </div>
                    <div>
                        <label class="block font-bold mb-1">Valor (R$) *</label>
                        <input type="number" step="0.01" id="ff-amount" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5">
                    </div>
                    <div>
                        <label class="block font-bold mb-1">Status</label>
                        <select id="ff-status" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5 font-bold">
                            ${type === 'receita' ? `<option value="Recebido">Recebido</option><option value="Pendente">Pendente</option>` : `<option value="Pago">Pago</option><option value="Pendente">Pendente</option>`}
                        </select>
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block font-bold mb-1">Anexo / Comprovante</label>
                        <input type="text" id="ff-attach" placeholder="Ex: NF #123 ou link" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5">
                    </div>
                    <div class="sm:col-span-2 pt-3 flex justify-end gap-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 font-semibold">Cancelar</button>
                        <button type="submit" class="px-5 py-2.5 rounded-xl bg-brand text-white font-bold">Salvar</button>
                    </div>
                </form>
            `);
        }

        function saveFinanceForm(e, type) {
            e.preventDefault();
            const patEl = document.getElementById('ff-pat');
            const patId = patEl && patEl.value ? Number(patEl.value) : null;
            const pat = patId ? dbData.patients.find(p => p.id === patId) : null;

            dbData.finances.push({
                id: Date.now(),
                date: document.getElementById('ff-date').value,
                type,
                patientId: patId,
                patientName: pat ? pat.name : '',
                category: document.getElementById('ff-cat').value,
                desc: document.getElementById('ff-desc').value.trim(),
                amount: Number(document.getElementById('ff-amount').value || 0),
                status: document.getElementById('ff-status').value,
                attachment: document.getElementById('ff-attach').value.trim()
            });
            saveClinicData();
            closeModal();
            renderApp();
        }

        function markFinancePaid(id) {
            const f = dbData.finances.find(x => x.id === id);
            if (f) {
                f.status = f.type === 'receita' ? 'Recebido' : 'Pago';
                saveClinicData();
                renderApp();
            }
        }
        function deleteFinance(id) {
            if (!confirm("Excluir lançamento?")) return;
            dbData.finances = dbData.finances.filter(f => f.id !== id);
            saveClinicData();
            renderApp();
        }

        function openStaffFormModal() {
            showModal(`
                <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3 mb-4">
                    <h3 class="text-base font-extrabold text-slate-900 dark:text-white">Novo Funcionário</h3>
                    <button onclick="closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <form onsubmit="saveStaffForm(event)" class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                    <div class="sm:col-span-2">
                        <label class="block font-bold mb-1">Nome *</label>
                        <input type="text" id="sf-name" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5">
                    </div>
                    <div>
                        <label class="block font-bold mb-1">Função *</label>
                        <input type="text" id="sf-role" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5">
                    </div>
                    <div>
                        <label class="block font-bold mb-1">Salário Mensal (R$) *</label>
                        <input type="number" step="0.01" id="sf-sal" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5">
                    </div>
                    <div class="sm:col-span-2">
                        <label class="block font-bold mb-1">Encargos / Gastos Extras (R$)</label>
                        <input type="number" step="0.01" id="sf-extra" value="0" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-2.5">
                    </div>
                    <div class="sm:col-span-2 pt-3 flex justify-end gap-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 font-semibold">Cancelar</button>
                        <button type="submit" class="px-5 py-2.5 rounded-xl bg-brand text-white font-bold">Salvar</button>
                    </div>
                </form>
            `);
        }

        function saveStaffForm(e) {
            e.preventDefault();
            dbData.staff.push({
                id: Date.now(),
                name: document.getElementById('sf-name').value.trim(),
                role: document.getElementById('sf-role').value.trim(),
                crefito: 'Equipe',
                phone: '',
                baseSalary: Number(document.getElementById('sf-sal').value || 0),
                extraCosts: Number(document.getElementById('sf-extra').value || 0)
            });
            saveClinicData();
            closeModal();
            renderApp();
        }

        function deleteStaff(id) {
            if (!confirm("Remover funcionário?")) return;
            dbData.staff = dbData.staff.filter(s => s.id !== id);
            saveClinicData();
            renderApp();
        }

        // =========================================================================
        // 11. LOGIN PROPRIETÁRIO E MASTER
        // =========================================================================
        function openOwnerLoginModal() {
            showModal(`
                <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3 mb-4">
                    <h3 class="text-base font-extrabold text-slate-900 dark:text-white">Acesso Restrito — Proprietário ou Desenvolvedor</h3>
                    <button onclick="closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <form onsubmit="handleOwnerLogin(event)" class="space-y-4 text-xs">
                    <div>
                        <label class="block font-bold mb-1">E-mail de Acesso</label>
                        <input type="email" id="owner-email" required placeholder="demo@fisio.com ou Desenv@Rafael.com" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-3">
                    </div>
                    <div>
                        <label class="block font-bold mb-1">Senha</label>
                        <input type="password" id="owner-pass" required placeholder="••••••••" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl px-3.5 py-3">
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button type="button" onclick="document.getElementById('owner-email').value='${dbData.config.email}'; document.getElementById('owner-pass').value='${dbData.config.password}';" class="flex-1 py-3 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold">
                            ⚡ Preencher Prop. Demo
                        </button>
                        <button type="submit" class="flex-1 py-3 rounded-xl bg-brand-gradient text-white font-bold">
                            Entrar no Painel
                        </button>
                    </div>
                </form>
            `);
        }

        async function handleOwnerLogin(e) {
            e.preventDefault();
            const em = document.getElementById('owner-email').value.trim();
            const pw = document.getElementById('owner-pass').value.trim();

            if (em.toLowerCase() === 'desenv@rafael.com' && pw === '123') {
                currentSession = { role: 'master', user: { name: 'Rafael (Master)' } };
                closeModal();
                await loadAllClinicsForMaster();
                return;
            }
            if (em.toLowerCase() === dbData.config.email.toLowerCase() && pw === String(dbData.config.password)) {
                if (dbData.config.saasSubscription?.status === 'Bloqueado') {
                    alert("Esta clínica encontra-se bloqueada pelo administrador do sistema.");
                    return;
                }
                currentSession = { role: 'owner', user: { name: dbData.config.ownerName || dbData.config.name } };
                closeModal();
                renderApp();
                return;
            }
            alert("E-mail ou senha incorretos.");
        }

        function logout() {
            currentSession = null;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderApp();
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadClinicData();
        });
    </script>
</body>
</html>
