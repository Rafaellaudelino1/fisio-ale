        let currentSessionUser = null;

        async function loadClinicData() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/fisio_data?store_id=eq.${storeId}`, {
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });
                if (response.ok) {
                    const rows = await response.json();
                    if (rows && rows.length > 0 && rows[0].data) {
                        dbData = rows[0].data;
                    } else {
                        await saveClinicDataToSupabase();
                    }
                }
            } catch (err) {
                console.warn("Usando localStorage (offline/fallback):", err);
                const local = localStorage.getItem(`fisio_store_${storeId}`);
                if (local) {
                    try { dbData = JSON.parse(local); } catch(e){}
                }
            }
            renderApp();
        }

        async function saveClinicDataToSupabase() {
            localStorage.setItem(`fisio_store_${storeId}`, JSON.stringify(dbData));
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/fisio_data`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'resolution=merge-duplicates'
                    },
                    body: JSON.stringify({
                        store_id: storeId,
                        data: dbData,
                        updated_at: new Date().toISOString()
                    })
                });
                document.getElementById('connection-indicator').className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
            } catch (err) {
                document.getElementById('connection-indicator').className = "w-2 h-2 rounded-full bg-amber-500 animate-pulse";
            }
        }

        function renderApp() {
            const app = document.getElementById('app');
            if (currentSessionUser && currentSessionUser.type === 'master') {
                app.innerHTML = renderMasterDeveloperPanel();
                return;
            }
            if (currentSessionUser && currentSessionUser.type === 'owner') {
                app.innerHTML = renderOwnerDashboard();
                return;
            }
            if (currentSessionUser && currentSessionUser.type === 'patient') {
                app.innerHTML = renderPatientPortal();
                return;
            }
            app.innerHTML = renderSplitScreenLanding();
        }

        function handlePatientQuickLogin(e) {
            e.preventDefault();
            const phoneInput = document.getElementById('quick-phone').value.trim().replace(/\D/g, '');

            if (!patient) {
                const name = prompt("Número não cadastrado. Digite seu Nome Completo para criar seu acesso:");
                if (!name) return;
                patient = {
                    id: Date.now(),
                    name: name.trim(),
                    phone: phoneInput,
                    cpf: "Não informado",
                    birth: "2000-01-01",
                    emergency: "Não informado",
                    diagnosis: "Avaliação Inicial Pendente",
                    anamnese: "Paciente cadastrado via portal web.",
                    consent: true,
                    packageTotal: 5,
                    packageUsed: 0,
                    totalSpent: 0
                };
                dbData.patients.push(patient);
                saveClinicDataToSupabase();
            }

            currentSessionUser = { type: 'patient', data: patient };
            renderApp();
        }

            const demoPat = dbData.patients[0] || { id: 1, name: "Mariana Costa", phone: "48988887777" };

                    </header>

                    <main class="max-w-6xl w-full mx-auto p-6 space-y-6 flex-1">
                        <div class="bg-gradient-to-r from-emerald-950/60 to-slate-900 border border-emerald-500/30 rounded-2xl p-5 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div class="flex items-center gap-4">
                                <div class="w-12 h-12 rounded-xl bg-emerald-500 text-slate-950 font-bold flex items-center justify-center text-xl shadow-lg">
                                    <i class="fa-solid fa-heart-pulse"></i>
                                </div>
                                <div>
                                    <h3 class="text-base font-bold text-white">Seu Tratamento na ${dbData.config.name}</h3>
                                    <p class="text-xs text-slate-300 mt-0.5">Diagnóstico: <span class="text-emerald-400 font-medium">${pat.diagnosis}</span></p>
                                </div>
                            </div>
                            <button onclick="openBookingModalForPatient(${pat.id})" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-5 py-3 rounded-xl shadow-lg shadow-emerald-600/30 transition flex items-center gap-2">
                                <i class="fa-solid fa-calendar-plus"></i> Agendar Nova Sessão
                            </button>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div class="lg:col-span-2 space-y-6">
                                ${dbData.config.modules.exercises ? `
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                    <div class="flex items-center justify-between mb-4">
                                        <h3 class="text-sm font-bold text-white flex items-center gap-2">
                                            <i class="fa-solid fa-dumbbell text-emerald-400"></i> Meus Exercícios em Casa
                                        </h3>
                                        <span class="text-xs text-slate-400">${myPrescriptions.length} exercícios</span>
                                    </div>
                                    <div class="space-y-3">
                                        ${myPrescriptions.length === 0 ? '<p class="text-xs text-slate-500 italic py-4 text-center">Nenhum exercício prescrito.</p>' : ''}
                                        ${myPrescriptions.map(p => {
                                            const ex = dbData.exercisesLibrary.find(item => item.id == p.exerciseId) || { title: "Exercício", category: "Geral", sets: "3x", reps: "10x", desc: "", video: "" };
                                            return `
                                                <div class="bg-slate-950 border border-slate-800/80 rounded-xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                                                    <div class="flex items-start gap-3">
                                                        <img src="${ex.video}" class="w-16 h-16 rounded-lg object-cover border border-slate-800 shrink-0">
                                                        <div>
                                                            <span class="text-[10px] uppercase font-bold text-emerald-400">${ex.category} • ${p.frequency}</span>
                                                            <h4 class="text-sm font-bold text-white mt-0.5">${ex.title}</h4>
                                                            <p class="text-xs text-slate-400 mt-1">${ex.sets} • ${ex.reps}</p>
                                                        </div>
                                                    </div>
                                                    <button onclick="togglePrescriptionDone(${p.id})" class="px-4 py-2 rounded-lg text-xs font-semibold transition ${p.doneToday ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700'}">
                                                        ${p.doneToday ? '<i class="fa-solid fa-check"></i> Feito Hoje' : '✓ Marcar como Feito'}
                                                    </button>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>` : ''}
                            </div>

                            <div class="space-y-6">
                                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                    <h3 class="text-sm font-bold text-white mb-4 flex items-center gap-2">
                                        <i class="fa-solid fa-calendar-days text-emerald-400"></i> Minhas Consultas
                                    </h3>
                                    <div class="space-y-3">
                                        ${myAppts.length === 0 ? '<p class="text-xs text-slate-500 italic py-4 text-center">Nenhuma consulta.</p>' : ''}
                                        ${myAppts.map(a => `
                                            <div class="bg-slate-950 border border-slate-800/80 rounded-xl p-3.5">
                                                <div class="flex items-center justify-between mb-1">
                                                    <span class="text-xs font-bold text-white">${a.date} às ${a.time}</span>
                                                    <span class="text-[10px] px-2 py-0.5 rounded font-semibold ${a.status === 'Concluído' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">${a.status}</span>
                                                </div>
                                                <p class="text-xs text-slate-300">${a.serviceName}</p>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        function togglePrescriptionDone(prescId) {
            const p = dbData.prescriptions.find(item => item.id == prescId);
            if (p) {
                p.doneToday = !p.doneToday;
                saveClinicDataToSupabase();
                renderApp();
            }
        }

        function renderOwnerDashboard() {
            return `
                <div class="flex-1 flex flex-col bg-slate-950 p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-white">Painel do Proprietário - ${dbData.config.name}</h2>
                        <button onclick="logoutSession()" class="bg-slate-800 text-xs px-3 py-2 rounded-lg text-slate-300">Sair</button>
                    </div>
                    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                        <p class="text-xs text-slate-400">Bem-vindo ao painel gerencial da clínica. Utilize o rodapé ou os atalhos para gerenciar agenda e pacientes.</p>
                        <button onclick="logoutSession()" class="mt-4 bg-emerald-600 text-white text-xs px-4 py-2 rounded-xl">Voltar à Página Inicial</button>
                    </div>
                </div>
            `;
        }

        function renderMasterDeveloperPanel() {
            return `
                <div class="flex-1 flex flex-col bg-slate-950 p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-amber-400">Painel Master do Desenvolvedor</h2>
                        <button onclick="logoutSession()" class="bg-slate-800 text-xs px-3 py-2 rounded-lg text-slate-300">Sair</button>
                    </div>
                    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                        <p class="text-xs text-slate-300">Clínica Atual na URL: <code class="text-emerald-400">?clinica=${storeId}</code></p>
                        <button onclick="logoutSession()" class="bg-emerald-600 text-white text-xs px-4 py-2 rounded-xl">Sair para o Site</button>
                    </div>
                </div>
            `;
        }

        function openOwnerLoginModal() {
            document.getElementById('owner-login-modal').classList.remove('hidden');
            document.getElementById('owner-login-modal').classList.add('flex');
        }
        function closeOwnerLoginModal() {
            document.getElementById('owner-login-modal').classList.remove('flex');
            document.getElementById('owner-login-modal').classList.add('hidden');
        }
        function fillDemoOwnerLogin() {
            document.getElementById('login-email').value = "demo@fisio.com";
            document.getElementById('login-password').value = "123";
        }

        function handleOwnerLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const pass = document.getElementById('login-password').value;

            if (email === "Desenv@Rafael.com" && pass === "123") {
                currentSessionUser = { type: 'master', data: { name: "Rafael Desenvolvedor" } };
                closeOwnerLoginModal();
                renderApp();
                return;
            }
            if (email === dbData.config.email && pass === dbData.config.password) {
                currentSessionUser = { type: 'owner', data: { name: "Fisioterapeuta Proprietário" } };
                closeOwnerLoginModal();
                renderApp();
                return;
            }
            alert("E-mail ou senha incorretos.");
        }

        function logoutSession() {
            currentSessionUser = null;
            renderApp();
        }

        function openSpecialtiesModal() {
            alert(`${dbData.config.name}\n\nEspecialidades: ${dbData.config.specialties}\n\nHorários: ${dbData.config.workingHours}`);
        }

        function openBookingModalForPatient(patId) {
            const servName = prompt("Escolha o Serviço:\n1. Fisioterapia Ortopédica (R$ 130)\n2. Avaliação Fisioterapêutica (R$ 180)", "Fisioterapia Ortopédica");
            if (!servName) return;
            const date = prompt("Data (AAAA-MM-DD):", "2026-10-21");
            const time = prompt("Horário (ex: 14:00):", "14:00");
            if (!date || !time) return;

            dbData.appointments.push({
                id: Date.now(),
                patientId: patId,
                patientName: currentSessionUser.data.name,
                serviceName: servName,
                profName: dbData.professionals[0].name,
                date: date,
                time: time,
                status: "Confirmado"
            });
            saveClinicDataToSupabase();
            alert("Consulta agendada com sucesso!");
            renderApp();
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadClinicData();
        });
    </script>
</body>
</html>
